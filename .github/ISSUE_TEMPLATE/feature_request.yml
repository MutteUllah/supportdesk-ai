name: Feature request
description: Propose an improvement to SupportDesk AI.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or use case
      description: Describe who needs this capability and what they are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work, including alternatives you considered.
    validations:
      required: true
